<!doctype html>
<!-- Recorte de la foto original para la vista previa del enlace: 1200 × 630 px. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <style>
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    img { display: block; width: 1200px; height: 630px; object-fit: cover; object-position: center 56%; }
  </style>
</head>
<body>
  <img src="originals/pileta-techada.webp" alt="Pileta y patio del Quincho Paraíso">
</body>
</html>
